<!--
=====================================================================
 FokusKu — Dashboard Disiplin & Produktivitas (iOS Frosted Glass)
 SATU FILE: HTML + Tailwind CDN + Font + JavaScript

 CARA PASANG GOOGLE SHEETS (opsional):
 1. Buka Google Sheets > Extensions > Apps Script, tempel kode ini:

    function doPost(e){
      var d = JSON.parse(e.postData.contents);
      var ss = SpreadsheetApp.getActiveSpreadsheet();
      var sh = ss.getSheetByName(d.sheet) || ss.insertSheet(d.sheet);
      var keys = Object.keys(d).filter(function(k){ return k !== 'sheet'; });
      if (sh.getLastRow() === 0) sh.appendRow(keys);
      sh.appendRow(keys.map(function(k){ return d[k]; }));
      return ContentService.createTextOutput('OK');
    }

 2. Deploy > New deployment > Web app > Who has access: Anyone.
 3. Salin URL Web App, tempel ke variabel WEB_APP_URL di bawah,
    ATAU tempel lewat tab Profil di dalam aplikasi.
 Catatan: data Streak/Api TIDAK dikirim ke Sheets (hanya LocalStorage).
=====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  window.tailwind = window.tailwind || {};
  window.tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', '"Noto Naskh Arabic"', 'system-ui', '-apple-system', 'sans-serif'] } } }
  };
</script>

<style>
  :root{
    --bg1:#e6e9ff; --bg2:#fde4f1; --bg3:#d9ecff;
    --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.55); --text:#0f172a; --muted:#64748b;
    --field:rgba(255,255,255,.55); --accent:#6366f1;
    --shadow:0 10px 36px rgba(60,70,160,.16);
    --blob:.55;
  }
  .dark{
    --bg1:#0a0e1f; --bg2:#1a1033; --bg3:#071a2e;
    --glass:rgba(32,36,58,.46); --glass-strong:rgba(40,44,70,.78);
    --line:rgba(255,255,255,.25); --text:#f1f5f9; --muted:#9aa6bd;
    --field:rgba(255,255,255,.08); --accent:#818cf8;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --blob:.38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
  html{overflow-y:auto;-webkit-overflow-scrolling:touch}
  body{overflow-x:clip;overflow-y:visible;width:100%}
  html,body{touch-action:pan-y}
  #view,header,nav{touch-action:pan-y}
  body{min-height:100vh;min-height:100dvh;color:var(--text);font-family:"Plus Jakarta Sans","Noto Naskh Arabic",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg1)}
  [dir="rtl"] body{font-family:"Noto Naskh Arabic","Plus Jakarta Sans",system-ui,sans-serif}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input,select,textarea{font-family:inherit}
  .muted{color:var(--muted)}

  /* ---------- Background ---------- */
  .bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
  .bg-blobs i{position:absolute;border-radius:50%;opacity:var(--blob);will-change:transform}
  .bg-blobs .b1{width:70vmax;height:70vmax;top:-26vmax;left:-20vmax;background:radial-gradient(circle,#818cf8 0%,transparent 65%);animation:drift 20s ease-in-out infinite alternate}
  .bg-blobs .b2{width:70vmax;height:70vmax;bottom:-30vmax;right:-24vmax;background:radial-gradient(circle,#f472b6 0%,transparent 65%);animation:drift 24s ease-in-out infinite alternate-reverse}
  .bg-blobs .b3{width:46vmax;height:46vmax;top:34%;left:28%;background:radial-gradient(circle,#38bdf8 0%,transparent 65%);animation:drift 28s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.12)}}

  /* ---------- Frosted Glass ---------- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    backdrop-filter:blur(28px) saturate(170%);
    border:1px solid var(--line);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);
    border-radius:1.75rem;
  }
  .glass-strong{
    background:var(--glass-strong);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--line);
    box-shadow:0 -10px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .inner{background:var(--field);border:1px solid var(--line);border-radius:1.25rem}

  .field{width:100%;padding:.8rem 1rem;border-radius:1rem;background:var(--field);border:1px solid var(--line);color:var(--text);font-size:16px;outline:none;transition:box-shadow .2s,border-color .2s}
  .field::placeholder{color:var(--muted);opacity:.8}
  .field:focus{box-shadow:0 0 0 3px rgba(99,102,241,.35);border-color:rgba(99,102,241,.6)}
  .btn{padding:.75rem 1.1rem;border-radius:1rem;font-weight:700;font-size:15px;transition:transform .15s ease,opacity .2s;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
  .btn:active{transform:scale(.94)}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.38)}
  .btn-ghost{background:var(--field);border:1px solid var(--line)}
  .btn-danger{background:rgba(244,63,94,.14);color:#e11d48}
  .dark .btn-danger{color:#fb7185}
  .iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .iconbtn:active{transform:scale(.85)}
  .h-title{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
  .tiny{font-size:.72rem}

  /* ---------- Bottom nav ---------- */
  #nav{padding:6px;display:flex}
  .nav-btn{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;border-radius:1.5rem;color:var(--muted);transition:color .25s,transform .15s}
  .nav-btn:active{transform:scale(.9)}
  .nav-btn .ico{font-size:21px;transition:transform .35s cubic-bezier(.34,1.56,.64,1);display:block}
  .nav-btn .lbl{font-size:10.5px;font-weight:700}
  .nav-btn.active{color:var(--accent)}
  .nav-btn.active .ico{transform:scale(1.22) translateY(-1px)}
  #navPill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:1.5rem;background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.22);transition:transform .38s cubic-bezier(.34,1.3,.64,1),width .38s;will-change:transform}

  /* ---------- Views ---------- */
  #view.enter > *{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
  #view.enter > *:nth-child(2){animation-delay:.05s}
  #view.enter > *:nth-child(3){animation-delay:.1s}
  #view.enter > *:nth-child(4){animation-delay:.15s}
  #view.enter > *:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}

  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .9s cubic-bezier(.22,1,.36,1)}
  .bar.green{background:linear-gradient(90deg,#10b981,#84cc16)}
  .bar.fire{background:linear-gradient(90deg,#f97316,#facc15)}
  .track{height:10px;border-radius:99px;background:var(--field);border:1px solid var(--line);overflow:hidden}
  .bar-v{height:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#818cf8,#ec4899);transition:height .8s cubic-bezier(.22,1,.36,1);min-height:3px}

  /* ---------- Habit rows ---------- */
  .habit-row{width:100%;display:flex;align-items:center;gap:.75rem;padding:.7rem .8rem;border-radius:1.15rem;background:var(--field);border:1px solid var(--line);transition:transform .15s,background .3s}
  .habit-row:active{transform:scale(.97)}
  .habit-row .check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;transition:all .3s cubic-bezier(.34,1.56,.64,1);flex:none}
  .habit-row.done{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.4)}
  .habit-row.done .check{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent}
  .habit-row.pop .check{animation:popin .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popin{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ---------- Streak flame ---------- */
  .flame-wrap{position:relative;width:124px;height:124px;flex:none;display:grid;place-items:center}
  .flame-glow{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(255,140,0,.6),rgba(255,80,0,.18) 55%,transparent 72%);opacity:0;transition:opacity .6s}
  .flame-svg{position:relative;width:88px;height:99px;transform-origin:50% 92%;transition:filter .6s,opacity .6s;--s:1}
  .lv4 .flame-svg{--s:1.32;filter:drop-shadow(0 0 14px #ff8a00) drop-shadow(0 0 34px #ff3d00);animation:flicker .55s ease-in-out infinite alternate}
  .lv3 .flame-svg{--s:1.08;filter:drop-shadow(0 0 10px rgba(255,150,0,.85));animation:flicker 1.1s ease-in-out infinite alternate}
  .lv2 .flame-svg{--s:.68;opacity:.85;filter:drop-shadow(0 0 6px rgba(255,180,70,.65));animation:flicker 1.8s ease-in-out infinite alternate}
  .lv0 .flame-svg{--s:.78;opacity:.3;filter:grayscale(1) brightness(.8);animation:none;transform:scale(var(--s))}
  .lv4 .flame-glow{opacity:1;animation:glowPulse 1.1s ease-in-out infinite}
  .lv3 .flame-glow{opacity:.55;animation:glowPulse 2s ease-in-out infinite}
  .lv2 .flame-glow{opacity:.2}
  @keyframes flicker{0%{transform:scale(var(--s)) rotate(-2.5deg)}100%{transform:scale(calc(var(--s)*1.07)) rotate(2.5deg)}}
  @keyframes glowPulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.12)}}
  .lv-emoji{position:absolute;top:6px;inset-inline-end:8px;font-size:22px;opacity:0}
  .lv2 .lv-emoji{opacity:1;animation:twinkle 1.6s ease-in-out infinite}
  .lv0 .lv-emoji{opacity:.6;animation:smoke 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(.7) rotate(0)}50%{transform:scale(1.15) rotate(18deg)}}
  @keyframes smoke{0%,100%{transform:translateY(4px);opacity:.25}50%{transform:translateY(-6px);opacity:.7}}
  .ember{position:absolute;bottom:34%;width:6px;height:6px;border-radius:50%;background:#ffb703;box-shadow:0 0 8px #ff7a00;opacity:0;display:none}
  .lv4 .ember{display:block;animation:ember 1.6s ease-out infinite}
  .lv3 .ember:nth-of-type(-n+3){display:block;animation:ember 2.2s ease-out infinite}
  @keyframes ember{0%{transform:translate3d(0,0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate3d(var(--x),-86px,0) scale(.2);opacity:0}}
  .streak-num{font-size:2.6rem;line-height:1;font-weight:800;letter-spacing:-.03em}
  .lv4 .streak-num{background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wk{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .wk .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--field);border:1px solid var(--line)}
  .wk .dot.full{background:rgba(249,115,22,.22);border-color:rgba(249,115,22,.55);box-shadow:0 0 14px rgba(249,115,22,.4)}
  .wk .dot.mid{background:rgba(249,115,22,.12);border-color:rgba(249,115,22,.3)}
  .wk .dot.today{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- Goals ---------- */
  .goal-done{border-color:rgba(250,204,21,.7)!important;box-shadow:0 0 28px rgba(250,204,21,.28),var(--shadow)!important}
  .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:99px;font-size:.7rem;font-weight:800;background:linear-gradient(135deg,#facc15,#f97316);color:#3b1d00}

  /* ---------- iOS switch & segmented ---------- */
  .switch{width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.35);position:relative;transition:background .25s;flex:none}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
  .switch.on{background:#34c759}
  .switch.on::after{transform:translateX(20px)}
  .seg{flex:1}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;padding:.65rem;border-radius:.9rem;font-weight:700;font-size:14px;background:var(--field);border:1px solid var(--line);transition:all .2s}
  .seg input:checked + span{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .chip{padding:.55rem .95rem;border-radius:99px;font-weight:700;font-size:14px;background:var(--field);border:1px solid var(--line);transition:all .2s}
  .chip.active{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-color:transparent}
  .chip:active{transform:scale(.93)}

  /* ---------- Avatar ---------- */
  .avatar{border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 6px 16px rgba(0,0,0,.18);flex:none;background-size:cover}

  /* ---------- Toast / Sheet / FX ---------- */
  #toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);inset-inline:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
  .toast{max-width:420px;padding:.7rem 1.1rem;border-radius:1.2rem;font-weight:700;font-size:14px;color:var(--text);animation:toastIn .4s cubic-bezier(.34,1.56,.64,1) both;text-align:center}
  .toast.out{animation:toastOut .3s ease forwards}
  .toast.ok{border-color:rgba(16,185,129,.6)} .toast.warn{border-color:rgba(245,158,11,.7)} .toast.err{border-color:rgba(244,63,94,.7)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-24px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(.9)}}
  #sheet{animation:sheetUp .42s cubic-bezier(.22,1,.36,1) both;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  #fx{position:fixed;inset:0;z-index:98;pointer-events:none;overflow:hidden}
  .conf{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
  #celebrate .card{animation:celebIn .6s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes celebIn{from{opacity:0;transform:scale(.5) rotate(-6deg)}to{opacity:1;transform:none}}
  .celeb-text{background:linear-gradient(135deg,#f59e0b,#ef4444,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;animation:glowText 1.4s ease-in-out infinite alternate}
  @keyframes glowText{from{filter:drop-shadow(0 0 4px rgba(245,158,11,.4))}to{filter:drop-shadow(0 0 16px rgba(239,68,68,.7))}}


  /* ---------- Utility fallback (jalan tanpa Tailwind CDN / offline) ---------- */
  .relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}
  .inset-0{inset:0}.inset-x-0{left:0;right:0}.bottom-0{bottom:0}
  .z-10{z-index:10}.z-50{z-index:50}.z-\[80\]{z-index:80}.z-\[95\]{z-index:95}
  .flex{display:flex}.grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1 1 0%}.flex-none{flex:none}
  .items-center{align-items:center}.items-end{align-items:flex-end}.items-baseline{align-items:baseline}
  .justify-between{justify-content:space-between}.justify-center{justify-content:center}
  .gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
  .min-w-0{min-width:0}.w-full{width:100%}.w-12{width:3rem}.h-12{height:3rem}
  .max-w-sm{max-width:24rem}.max-w-md{max-width:28rem}.max-w-lg{max-width:32rem}.mx-auto{margin-left:auto;margin-right:auto}
  .p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}.p-6{padding:1.5rem}.p-8{padding:2rem}
  .px-4{padding-left:1rem;padding-right:1rem}.pt-4{padding-top:1rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}
  .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
  .mb-1\.5{margin-bottom:.375rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
  .my-3{margin-top:.75rem;margin-bottom:.75rem}.my-4{margin-top:1rem;margin-bottom:1rem}
  .space-y-1>*+*{margin-top:.25rem}.space-y-2>*+*{margin-top:.5rem}.space-y-3>*+*{margin-top:.75rem}.space-y-4>*+*{margin-top:1rem}
  .text-sm{font-size:.875rem;line-height:1.25rem}.text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}
  .text-2xl{font-size:1.5rem;line-height:2rem}.text-3xl{font-size:1.875rem;line-height:2.25rem}
  .text-5xl{font-size:3rem;line-height:1}.text-6xl{font-size:3.75rem;line-height:1}
  .font-semibold{font-weight:600}.font-bold{font-weight:700}.font-extrabold{font-weight:800}
  .text-center{text-align:center}.text-start{text-align:start}.uppercase{text-transform:uppercase}.tracking-wide{letter-spacing:.025em}
  .leading-tight{line-height:1.25}.line-through{text-decoration:line-through}.opacity-60{opacity:.6}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w-full.btn,.btn.w-full{display:flex}
  .max-w-xs{max-width:20rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}.mt-5{margin-top:1.25rem}.mt-8{margin-top:2rem}

  /* ---------- Welcome page ---------- */
  #welcome{position:fixed;inset:0;z-index:120;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.welcome-on #welcome{display:block}
  body.welcome-on #app,body.welcome-on #nav{display:none!important}
  #welcome .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px)}
  #welcome.leave{animation:wLeave .45s ease forwards;pointer-events:none}
  @keyframes wLeave{to{opacity:0;transform:scale(1.04)}}
  .w-in{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
  .w-logo{width:116px;height:116px;border-radius:32px;display:grid;place-items:center;font-size:62px;margin:0 auto;background:linear-gradient(145deg,rgba(255,170,60,.35),rgba(255,70,50,.25));border:1px solid var(--line);box-shadow:0 0 50px rgba(255,120,0,.45),inset 0 1px 0 rgba(255,255,255,.4);animation:glowPulse 2.2s ease-in-out infinite}
  .w-title{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#6366f1,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}

  ::-webkit-scrollbar{display:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<body>
  <div class="bg-blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <div id="toasts"></div>
  <div id="fx"></div>

  <!-- Hidden photo inputs (gallery & camera) -->
  <input type="file" id="photoGallery" accept="image/*" hidden>
  <input type="file" id="photoCamera" accept="image/*" capture="user" hidden>

  <div id="app" class="relative z-10 mx-auto w-full max-w-lg">
    <!-- Header -->
    <header class="flex items-center gap-3 px-4" style="padding-top:calc(env(safe-area-inset-top) + 14px)">
      <button id="hdrAvatar" data-act="goProfile" class="w-12 h-12 flex-none" aria-label="Profile"></button>

async function sendToGoogleSheet(sheetName, data){
  const url = String(LS.get('sheetUrl', '') || WEB_APP_URL || '').trim();
  if (!url){ toast(t('toast.saved'), 'ok'); return false; } // data sudah tersimpan di aplikasi (LocalStorage)
  try {
    await fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ sheet: sheetName, pengguna: profile.name || '', waktu: new Date().toISOString() }, data))
    });
    toast(t('toast.synced'), 'ok');
    return true;
  } catch (err) {
    toast(t('toast.syncFail'), 'err');
    return false;
  }
}

function toast(msg, type){
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast glass ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
  while (box.children.length > 3) box.firstChild.remove();
}

function confetti(n){
  const box = $('#fx'); const colors = ['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#facc15'];

/* =====================================================================
   HABITS & STREAK (LocalStorage only)
   ===================================================================== */
function syncToday(){
  const d = todayStr(); const ids = new Set(habits.map(h => h.id));
  const l = habitLog[d] || { done: [], total: 0 };
  l.done = l.done.filter(i => ids.has(i)); l.total = habits.length;
  habitLog[d] = l; return l;
}
function pruneLog(){
  const limit = fmtD(addDays(new Date(), -400));
  Object.keys(habitLog).forEach(k => { if (k < limit) delete habitLog[k]; });
}
function dayRatio(d){ const l = habitLog[d]; return (!l || !l.total) ? 0 : l.done.length / l.total; }
function calcStreak(){
  syncToday();
  let s = 0; let cur = new Date();
  if (dayRatio(fmtD(cur)) > 0) s = 1;
  cur = addDays(cur, -1);
  let guard = 0;
  while (dayRatio(fmtD(cur)) > 0 && guard++ < 4000){ s++; cur = addDays(cur, -1); }
  return s;
}
function habitStats(){
  const l = syncToday(); const total = habits.length; const done = l.done.length;
  const r = total ? done / total : 0;
  const lvl = !total ? 0 : r === 1 ? 4 : r >= .5 ? 3 : r > 0 ? 2 : 0;
  const streak = calcStreak();
  if (streak > bestStreak){ bestStreak = streak; LS.set('bestStreak', bestStreak); }
  return { total, done, r, pct: Math.round(r * 100), lvl, streak, todayZero: done === 0 };
}
function saveHabits(){ pruneLog(); LS.set('habits', habits); LS.set('habitLog', habitLog); }

  if (!s.total) msg = t('streak.none');

          '<path d="M32 33C34 41 43 45 43 54C43 62 38 67 32 67C26 67 21 62 21 54C21 48 25 45 27 40C28 44 30 45 31 45C30 40 30 36 32 33Z" fill="url(#fgInner)"/>' +

/* =====================================================================
   FINANCE HELPERS
   ===================================================================== */
const sumTx = type => tx.filter(x => x.type === type).reduce((a, b) => a + b.amount, 0);
const balance = () => sumTx('in') - sumTx('out');
const goalPct = g => g.target > 0 ? Math.min(100, Math.floor(g.saved / g.target * 100)) : 0;
function nearestGoal(){
  const open = goals.filter(g => g.saved < g.target).sort((a, b) => goalPct(b) - goalPct(a));
  return open[0] || goals[0] || null;
}
function goalNotes(g){
  const remaining = Math.max(0, g.target - g.saved); const out = [];
  if (remaining <= 0) return out;
  if (g.deadline){
    const days = Math.ceil((parseD(g.deadline) - new Date()) / 86400000);
    if (days > 0){
      const months = Math.max(1, days / 30.44);
      out.push('📅 ' + t('goal.need', money(remaining / months), money(remaining / (days / 7))));
    } else out.push('⚠️ ' + t('goal.late'));
  }
  if (g.monthly > 0){
    const m = Math.ceil(remaining / g.monthly);
    const d = new Date(); d.setMonth(d.getMonth() + m);
    out.push('🧮 ' + t('goal.eta', d.toLocaleDateString(LOC[lang], { month: 'long', year: 'numeric' }), m));
  }
  return out;
}
function goalCard(g){
  const pct = goalPct(g); const done = g.saved >= g.target;
  const notes = goalNotes(g).map(n => '<div class="tiny muted">' + esc(n) + '</div>').join('');
  return '<div class="inner p-4 ' + (done ? 'goal-done' : '') + '">' +
    '<div class="flex items-center justify-between gap-2">' +
      '<div class="font-extrabold truncate">' + (done ? '🏆 ' : '🎯 ') + esc(g.name) + '</div>' +
      (done ? '<span class="badge">' + esc(t('goal.badge')) + '</span>' : '<span class="font-extrabold" style="color:var(--accent)">' + pct + '%</span>') +
    '</div>' +
    '<div class="track my-3"><div class="bar ' + (done ? 'fire' : '') + '" data-w="' + pct + '"></div></div>' +
    '<div class="flex justify-between text-sm font-bold"><span>' + money(g.saved) + '</span><span class="muted">' + money(g.target) + '</span></div>' +
    (done ? '<div class="celeb-text font-extrabold text-center mt-2">' + esc(t('goal.done')) + '</div>'
          : '<div class="tiny muted mt-1">' + esc(t('goal.remaining', money(g.target - g.saved))) + '</div>' + '<div class="space-y-1 mt-2">' + notes + '</div>') +
    (!done ? '<div class="mt-3"><label class="tiny muted font-bold">' + esc(t('goal.monthly')) + '</label>' +
      '<input class="field mt-1" inputmode="numeric" placeholder="Rp 0" oninput="fmtRp(this)" data-change="setMonthly" data-id="' + g.id + '" value="' + (g.monthly ? rp(g.monthly) : '') + '"></div>' : '') +
    '<div class="flex gap-2 mt-3">' +
      (!done ? '<button data-act="deposit" data-id="' + g.id + '" class="btn btn-primary flex-1">' + esc(t('goal.deposit')) + '</button>' : '') +
      '<button data-act="delGoal" data-id="' + g.id + '" class="btn btn-danger">🗑️</button>' +
    '</div>' +
  '</div>';
}

function initials(name){
  const p = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function avatarHTML(size, fs){
  const px = 'width:' + size + 'px;height:' + size + 'px;';
  if (photo) return '<div class="avatar" style="' + px + '"><img src="' + photo + '" alt="" style="width:100%;height:100%;object-fit:cover"></div>';
  let h = 0; const n = profile.name || '?'; for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
  return '<div class="avatar" style="' + px + 'font-size:' + fs + 'px;background:linear-gradient(145deg,hsl(' + h + ',80%,62%),hsl(' + ((h + 50) % 360) + ',75%,50%))">' + esc(initials(profile.name)) + '</div>';
}

    '<div class="inner p-3 flex items-center gap-3"><div class="text-2xl">' + (x.type === 'in' ? '⬆️' : '⬇️') + '</div>' +
    '<div class="min-w-0 flex-1"><div class="font-bold truncate">' + esc(x.note || (x.type === 'in' ? t('money.income') : t('money.expense'))) + '</div><div class="tiny muted">' + esc(fmtDate(x.date)) + '</div></div>' +
    '<div class="font-extrabold" style="color:' + (x.type === 'in' ? '#10b981' : '#f43f5e') + '">' + (x.type === 'in' ? '+' : '−') + money(x.amount).replace('Rp ', '') + '</div>' +
    '<button data-act="delTx" data-id="' + x.id + '" class="iconbtn btn-danger" style="width:34px;height:34px;font-size:14px">🗑️</button></div>').join('') || '<div class="muted text-center py-3">' + esc(t('money.empty')) + '</div>';
  const goalList = goals.length ? goals.map(goalCard).join('') : '<div class="muted text-center py-3">' + esc(t('goal.empty')) + '</div>';
  return '<section class="glass p-5">' +
      '<div class="tiny muted font-bold">' + esc(t('money.balance')) + '</div>' +
      '<div class="text-3xl font-extrabold mt-1 truncate" style="letter-spacing:-.02em">' + money(balance()) + '</div>' +
      '<div class="grid grid-cols-2 gap-3 mt-4">' +
        '<div class="inner p-3"><div class="tiny muted font-bold">⬆️ ' + esc(t('money.income')) + '</div><div class="font-extrabold truncate" style="color:#10b981">' + money(sumTx('in')) + '</div></div>' +
        '<div class="inner p-3"><div class="tiny muted font-bold">⬇️ ' + esc(t('money.expense')) + '</div><div class="font-extrabold truncate" style="color:#f43f5e">' + money(sumTx('out')) + '</div></div>' +
      '</div></section>' +
    '<section class="glass p-5">' + secTitle(t('money.add')) +
      '<form data-form="addTx" class="space-y-2">' +
        '<div class="flex gap-2"><label class="seg relative"><input type="radio" name="type" value="out" checked><span>⬇️ ' + esc(t('money.expense')) + '</span></label>' +
        '<label class="seg relative"><input type="radio" name="type" value="in"><span>⬆️ ' + esc(t('money.income')) + '</span></label></div>' +
        '<input name="amount" class="field" inputmode="numeric" placeholder="' + esc(t('money.amount')) + ' (Rp)" oninput="fmtRp(this)" required>' +
        '<input name="note" class="field" placeholder="' + esc(t('money.note')) + '" maxlength="80">' +
        '<button class="btn btn-primary w-full">' + esc(t('money.add')) + '</button></form></section>' +
    '<section class="glass p-5">' + secTitle(t('goal.title')) +
      '<form data-form="addGoal" class="space-y-2 mb-4">' +
        '<input name="name" class="field" placeholder="' + esc(t('goal.name')) + '" required maxlength="60">' +
        '<input name="target" class="field" inputmode="numeric" placeholder="' + esc(t('goal.target')) + ' (Rp)" oninput="fmtRp(this)" required>' +
        '<div class="flex gap-2"><input name="deadline" type="date" class="field" aria-label="' + esc(t('goal.deadline')) + '"><button class="btn btn-primary" style="flex:none">🎯 ' + esc(t('goal.add')) + '</button></div></form>' +
      '<div class="space-y-3">' + goalList + '</div></section>' +
    '<section class="glass p-5">' + secTitle(t('money.history')) + '<div class="space-y-2">' + txList + '</div></section>';
}

function sw(on, act){ return '<button data-act="' + act + '" class="switch ' + (on ? 'on' : '') + '" dir="ltr" role="switch" aria-checked="' + on + '"></button>'; }

  const url = LS.get('sheetUrl', '');

      '<div class="flex flex-wrap justify-center gap-2 mt-2">' +
        '<button data-act="photoGallery" class="btn btn-ghost">🖼️ ' + esc(t('profile.gallery')) + '</button>' +

        '<div class="flex items-center justify-between"><span class="font-bold">' + (privacy ? '🙈' : '👁️') + ' ' + esc(t('profile.privacy')) + '</span>' + sw(privacy, 'togglePrivacy') + '</div>' +

    '<section class="glass p-5">' + secTitle(t('profile.sheet')) +

const VIEWS = { home: viewHome, study: viewStudy, money: viewMoney, habit: viewHabit, profile: viewProfile };

/* =====================================================================
   RENDER
   ===================================================================== */
function animateBars(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; });
    document.querySelectorAll('[data-h]').forEach(el => { el.style.height = el.dataset.h + '%'; });
  }));
}
function positionPill(){
  const active = document.querySelector('.nav-btn.active'); const pill = $('#navPill');
  if (!active) return;
  pill.style.width = active.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + active.offsetLeft + 'px)';
}
function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  positionPill();
}
function render(animate){
  const v = $('#view');
  v.innerHTML = VIEWS[tab]();
  if (animate){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  lastToggled = null;
  updateNav(); animateBars();
}
function go(newTab){
  if (newTab === tab){ window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  tab = newTab; vib(8); window.scrollTo(0, 0); render(true);
}
function greetKey(){
  const h = new Date().getHours();
  return h < 11 ? 'greet.morning' : h < 15 ? 'greet.afternoon' : h < 18 ? 'greet.evening' : 'greet.night';
}
function renderHeader(){
  const h = new Date().getHours();
  const em = h < 11 ? '🌅' : h < 15 ? '☀️' : h < 18 ? '🌇' : '🌙';
  $('#greetSmall').textContent = em + ' ' + t(greetKey());
  $('#greetName').textContent = profile.name || t('common.guest');
  $('#hdrAvatar').innerHTML = avatarHTML(48, 18);
  $('#btnPrivacy').textContent = privacy ? '🙈' : '👁️';
  $('#btnTheme').textContent = dark ? '☀️' : '🌙';
  $('#btnLang').textContent = LANG_LABEL[lang];
}
function applyI18n(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
}
function applyTheme(){
  document.documentElement.classList.toggle('dark', !!dark);
  $('#metaTheme').setAttribute('content', dark ? '#0a0e1f' : '#eef0ff');
}
function refreshAll(){ applyTheme(); applyI18n(); renderHeader(); render(false); }

/* =====================================================================
   ACTIONS (click)
   ===================================================================== */
const A = {
  nav(el){ go(el.dataset.tab); },
  goProfile(){ go('profile'); },
  toggleTheme(){ dark = !dark; LS.set('dark', dark); vib(10); refreshAll(); },
  togglePrivacy(){ privacy = !privacy; LS.set('privacy', privacy); vib(10); renderHeader(); render(false); },
  cycleLang(){ setLang(LANG_ORDER[(LANG_ORDER.indexOf(lang) + 1) % LANG_ORDER.length]); },
  setLang(el){ setLang(el.dataset.lang); },
  closeSheet(){ closeSheet(false); },
  closeCelebrate(){ $('#celebrate').style.display = 'none'; },

  toggleHabit(el){
    const id = el.dataset.id; const l = syncToday(); const i = l.done.indexOf(id);
    const wasFull = l.total > 0 && l.done.length === l.total;
    const wasZero = l.done.length === 0;
    if (i >= 0) l.done.splice(i, 1); else l.done.push(id);
    lastToggled = id; vib(12);
    const nowFull = l.total > 0 && l.done.length === l.total;
    let party = false;
    if (nowFull && !wasFull && !l.celebrated){ l.celebrated = true; party = true; }
    saveHabits(); const keep = lastToggled; render(false); 
    if (party){ toast(t('toast.fullDone'), 'ok'); confetti(90); vib([40, 30, 80]); }
    else if (wasZero && l.done.length === 1) toast(t('toast.lit'), 'ok');
    void keep;
  },
  delHabit(el){ habits = habits.filter(h => h.id !== el.dataset.id); syncToday(); saveHabits(); toast(t('toast.deleted')); render(false); },
  delStudy(el){ study = study.filter(s => s.id !== el.dataset.id); LS.set('study', study); toast(t('toast.deleted')); render(false); },
  toggleTask(el){
    const k = tasks.find(x => x.id === el.dataset.id); if (!k) return;
    k.done = !k.done; LS.set('tasks', tasks); vib(10); render(false);
    if (k.done) sendToGoogleSheet('Tugas', { tugas: k.title, tenggat: k.due || '', status: 'selesai' });
  },
  delTask(el){ tasks = tasks.filter(x => x.id !== el.dataset.id); LS.set('tasks', tasks); toast(t('toast.deleted')); render(false); },
  delTx(el){ tx = tx.filter(x => x.id !== el.dataset.id); LS.set('tx', tx); toast(t('toast.deleted')); render(false); },
  delGoal(el){ goals = goals.filter(g => g.id !== el.dataset.id); LS.set('goals', goals); toast(t('toast.deleted')); render(false); },
  deposit(el){
    const g = goals.find(x => x.id === el.dataset.id); if (!g) return;
    openSheet('<div class="h-title mb-3">' + esc(t('goal.depositTitle', g.name)) + '</div>' +
      '<form data-form="deposit" data-goal="' + g.id + '" class="space-y-3">' +
      '<input name="amount" class="field" inputmode="numeric" placeholder="Rp 0" oninput="fmtRp(this)" required autofocus>' +
      '<div class="flex gap-2"><button type="button" data-act="closeSheet" class="btn btn-ghost flex-1">' + esc(t('common.cancel')) + '</button><button class="btn btn-primary flex-1">' + esc(t('common.save')) + '</button></div></form>');
  },
  photoGallery(){ $('#photoGallery').click(); },
  photoCamera(){ $('#photoCamera').click(); },
  removePhoto(){ photo = ''; try { localStorage.removeItem('fk_photo'); } catch(e){} renderHeader(); render(false); toast(t('toast.deleted')); },
  resetAll(){
    if (!confirm(t('profile.resetAsk'))) return;
    try { Object.keys(localStorage).filter(k => k.indexOf('fk_') === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
    location.reload();
  }
};
function setLang(l){
  lang = l; LS.set('lang', lang); vib(8);
  applyI18n(); renderHeader(); render(false);
  requestAnimationFrame(positionPill);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.change === 'setMonthly'){
    const g = goals.find(x => x.id === el.dataset.id); if (!g) return;
    g.monthly = parseRp(el.value); LS.set('goals', goals); render(false);
  }
});

/* =====================================================================
   FORMS (submit)
   ===================================================================== */
const F = {
  onboard(f){
    const name = f.elements.name.value.trim(); if (!name){ toast(t('toast.needName'), 'warn'); return; }
    profile.name = name; LS.set('profile', profile);
    closeWelcome(); toast(t('toast.saved'), 'ok');
  },
  saveName(f){
    const name = f.elements.name.value.trim(); if (!name){ toast(t('toast.needName'), 'warn'); return; }
    profile.name = name; LS.set('profile', profile); renderHeader(); render(false); toast(t('toast.saved'), 'ok');
  },
  saveUrl(f){ LS.set('sheetUrl', f.url.value.trim()); toast(t('toast.saved'), 'ok'); },
  addHabit(f){
    const name = f.elements.name.value.trim(); if (!name) return;
    habits.push({ id: uid(), name, emoji: f.emoji.value.trim() || '✅' });
    syncToday(); saveHabits(); toast(t('toast.saved'), 'ok'); render(false);
  },
  addStudy(f){
    const subject = f.subject.value.trim(); const min = parseInt(f.min.value, 10);
    if (!subject || !(min > 0)) return;
    const rec = { id: uid(), subject, min, note: f.note.value.trim(), date: todayStr(), ts: Date.now() };
    study.push(rec); LS.set('study', study); render(false); vib(12);
    sendToGoogleSheet('Belajar', { tanggal: rec.date, mata_pelajaran: rec.subject, durasi_menit: rec.min, catatan: rec.note });
  },
  addTask(f){
    const title = f.title.value.trim(); if (!title) return;
    const rec = { id: uid(), title, due: f.due.value || '', done: false, ts: Date.now() };
    tasks.push(rec); LS.set('tasks', tasks); render(false); vib(12);
    sendToGoogleSheet('Tugas', { tugas: rec.title, tenggat: rec.due, status: 'baru' });
  },
  addTx(f){
    const amount = parseRp(f.amount.value); if (amount <= 0){ toast(t('toast.needAmount'), 'warn'); return; }
    const type = f.elements.type.value;
    const rec = { id: uid(), type, amount, note: f.note.value.trim(), date: todayStr(), ts: Date.now() };
    tx.push(rec); LS.set('tx', tx); render(false); vib(12);
    sendToGoogleSheet('Keuangan', { tanggal: rec.date, jenis: type === 'in' ? 'Pemasukan' : 'Pengeluaran', nominal: amount, keterangan: rec.note, saldo: balance() });
  },
  addGoal(f){
    const name = f.elements.name.value.trim(); const target = parseRp(f.elements.target.value);
    if (!name) return; if (target <= 0){ toast(t('toast.needAmount'), 'warn'); return; }
    const g = { id: uid(), name, target, saved: 0, deadline: f.deadline.value || '', monthly: 0, celebrated: false, ts: Date.now() };
    goals.push(g); LS.set('goals', goals); render(false); vib(12);
    sendToGoogleSheet('Target', { target: g.name, nominal_target: g.target, terkumpul: 0, persen: 0, tenggat: g.deadline, aksi: 'dibuat' });
  },
  deposit(f){
    const g = goals.find(x => x.id === f.dataset.goal); if (!g) return;
    const amount = parseRp(f.amount.value); if (amount <= 0){ toast(t('toast.needAmount'), 'warn'); return; }
    g.saved += amount; closeSheet(true);
    let reached = false;
    if (g.saved >= g.target && !g.celebrated){ g.celebrated = true; reached = true; }
    LS.set('goals', goals); render(false); vib(15);
    if (reached) celebrateGoal(g);
    sendToGoogleSheet('Target', { target: g.name, nominal_target: g.target, terkumpul: g.saved, persen: goalPct(g), tenggat: g.deadline, aksi: reached ? 'tercapai' : 'setor ' + amount });
  }
};
document.addEventListener('submit', e => {
  const f = e.target; const name = f.dataset && f.dataset.form;
  if (!name || !F[name]) return;
  e.preventDefault(); F[name](f);
});

/* =====================================================================
   PROFILE PHOTO (Base64 → LocalStorage)
   ===================================================================== */
function handlePhoto(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast(t('toast.photoErr'), 'err');
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => toast(t('toast.photoErr'), 'err');
    img.onload = () => {
      try {
        const S = 320; const c = document.createElement('canvas'); c.width = c.height = S;
        const ctx = c.getContext('2d'); const m = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        const data = c.toDataURL('image/jpeg', 0.85);
        if (!LS.set('photo', data)){ toast(t('toast.storage'), 'err'); return; }
        photo = data; renderHeader(); if (tab === 'profile') render(false);
        toast(t('toast.photoOk'), 'ok'); vib(15);
      } catch (err) { toast(t('toast.photoErr'), 'err'); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
['photoGallery', 'photoCamera'].forEach(id => {
  $('#' + id).addEventListener('change', e => { handlePhoto(e.target.files[0]); e.target.value = ''; });
});

/* =====================================================================
   PWA — PASANG APLIKASI
   ===================================================================== */
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tab === 'profile') render(false); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast(t('install.ok'), 'ok'); confetti(60); if (tab === 'profile') render(false); });
function installCard(){
  const on = isStandalone();
  return '<section class="glass p-5">' + secTitle(t('install.title')) +
    '<div class="flex items-center gap-3 mb-3"><img src="icon-192.png" alt="" onerror="this.style.display=\'none\'" style="width:54px;height:54px;border-radius:14px;flex:none"><div class="tiny muted">' + esc(t('install.desc')) + '</div></div>' +
    '<div class="tiny muted mb-3">' + esc(t('install.mode')) + ': <b>' + esc(on ? t('install.standalone') : t('install.browser')) + '</b></div>' +
    (on ? '<div class="btn btn-ghost w-full" style="opacity:.8">' + esc(t('install.done')) + '</div>'
        : '<button data-act="installApp" class="btn btn-primary w-full">' + esc(t('install.btn')) + '</button>') +
  '</section>';
}
A.installApp = async function(){
  if (isStandalone()){ toast(t('install.done'), 'ok'); return; }
  if (deferredInstall){
    try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch (e) {}
    deferredInstall = null; render(false); return;
  }
  const steps = isIOS() ? ['install.i1', 'install.i2', 'install.i3'] : ['install.a1', 'install.a2', 'install.a3'];
  openSheet('<div class="h-title mb-3">📲 ' + esc(t('install.manual')) + '</div><div class="space-y-2">' +
    steps.map((k, i) => '<div class="inner p-3 flex items-center gap-3"><span class="badge" style="flex:none">' + (i + 1) + '</span><span class="font-semibold">' + esc(t(k)) + '</span></div>').join('') +
    '</div><div class="tiny muted mt-3">' + esc(t('install.note')) + '</div>' +
    '<button data-act="closeSheet" class="btn btn-ghost w-full mt-4">' + esc(t('common.close')) + '</button>');
};
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* =====================================================================
   HALAMAN WELCOME (terpisah dari halaman utama)
   ===================================================================== */
function renderWelcome(keepName){
  const langs = LANG_ORDER.map(l => '<button type="button" data-act="setLangOnboard" data-lang="' + l + '" class="chip ' + (l === lang ? 'active' : '') + '">' + LANG_NAME[l] + '</button>').join('');
  const w = $('#welcome');
  w.innerHTML = '<div class="wrap"><div class="w-in w-full max-w-sm text-center">' +
    '<div class="w-logo">🔥</div>' +
    '<div class="w-title mt-5">FokusKu</div>' +
    '<div class="muted font-semibold mt-2">' + esc(t('onboard.tag')) + '</div>' +
    '<div class="glass p-5 mt-8 text-start">' +
      '<div class="tiny muted font-bold mb-2">' + esc(t('onboard.lang')) + '</div>' +
      '<div class="flex flex-wrap gap-2 mb-4">' + langs + '</div>' +
      '<form data-form="onboard" class="space-y-3"><label class="font-bold">' + esc(t('onboard.ask')) + '</label>' +
      '<input name="name" class="field" maxlength="40" required autocomplete="name" placeholder="' + esc(t('onboard.ph')) + '" value="' + esc(keepName || '') + '">' +
      '<button class="btn btn-primary w-full">' + esc(t('onboard.start')) + ' →</button></form>' +
    '</div></div></div>';
}
function openOnboarding(){
  document.body.classList.add('welcome-on');
  const w = $('#welcome'); w.classList.remove('leave');
  renderWelcome('');
  window.scrollTo(0, 0);
}
function closeWelcome(){
  const w = $('#welcome'); w.classList.add('leave');
  setTimeout(() => {
    document.body.classList.remove('welcome-on'); w.classList.remove('leave'); w.innerHTML = '';
    renderHeader(); tab = 'home'; render(true); window.scrollTo(0, 0);
    requestAnimationFrame(positionPill); setTimeout(positionPill, 150);
  }, 420);
}
A.setLangOnboard = function(el){
  const cur = document.querySelector('#welcome input[name=name]'); const keep = cur ? cur.value : '';
  lang = el.dataset.lang; LS.set('lang', lang); applyI18n(); renderHeader(); renderWelcome(keep);
};

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  syncToday(); saveHabits();
  applyTheme(); applyI18n(); renderHeader(); render(true);
  if (!profile.name) openOnboarding();
  window.addEventListener('resize', positionPill);
  window.addEventListener('orientationchange', () => setTimeout(positionPill, 250));
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ renderHeader(); render(false); } });
  setInterval(renderHeader, 60000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionPill);
  setTimeout(positionPill, 300);
}
init();
</script>
